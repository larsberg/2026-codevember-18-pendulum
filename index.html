<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <style>
      html { background: #000; }
      #stage-status {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font: 14px system-ui, sans-serif;
        text-align: center;
      }
      #stage-status span { animation: show-status 0s 0.5s backwards; }
      @keyframes show-status { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <main id="sketch-root">
      <section class="sketch">
        <canvas class="scene-canvas" tabindex="0"></canvas>
        <div id="stage-status" role="status"><span>Loading the stage…</span></div>
      </section>
    </main>
    <script type="module">
      import('./src/main.js').catch(error => {
        document.getElementById('stage-status').textContent = 'The stage couldn’t load. Reload to try again.';
        console.error(error);
      });
    </script>
  </body>
</html>
